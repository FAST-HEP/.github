name: Package CI

# Reusable: the pixi `ci` task of a package, once per environment.
# Caller: `uses: FAST-HEP/.github/.github/workflows/package-ci.yml@main`, triggered by the caller.
# During alpha failures do not block (allow-failure); flip the default here when CI becomes required.

on:
  workflow_call:
    inputs:
      allow-failure:
        description: "Alpha: a failing run does not fail the workflow (set false to make it strict)"
        type: boolean
        default: true
      matrix:
        description: JSON list of {pixi-env, python-version[, experimental]}
        type: string
        default: >-
          [{"pixi-env":"py311","python-version":"3.11"},
          {"pixi-env":"py313","python-version":"3.13"},
          {"pixi-env":"py314","python-version":"3.14","experimental":true}]
      pixi-version:
        type: string
        default: v0.62.2

permissions:
  contents: read

env:
  FORCE_COLOR: "3"

jobs:
  ci:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.allow-failure || matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false

      - name: Run CI
        env:
          PIXI_ENV: ${{ matrix.pixi-env }}
        run: pixi run --environment "$PIXI_ENV" ci
