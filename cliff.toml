# Shared git-cliff configuration for the FAST-HEP package changelogs.
# Rules: docs/commit-convention.md. The section is inserted into CHANGELOG.md by
# scripts/fasthep_changelog.py, so no header or footer is rendered here.

[changelog]
header = ""
footer = ""
trim = true
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.breaking %}**Breaking**: {% endif %}{% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{%- endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "20[0-9]{2}\\.[0-9]{2}\\.[0-9]+"
sort_commits = "oldest"
# Group names carry a sort prefix: keepachangelog order, prefix stripped in the template.
commit_parsers = [
  { message = "^Merge", skip = true },
  { footer = "^Changelog\\W*skip\\s*$", skip = true },
  { footer = "^Changelog\\W*deprecated\\s*$", group = "<!-- 2 -->Deprecated" },
  { footer = "^Changelog\\W*removed\\s*$", group = "<!-- 3 -->Removed" },
  { footer = "^Changelog\\W*security\\s*$", group = "<!-- 5 -->Security" },
  { breaking = true, group = "<!-- 1 -->Changed" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^(refactor|perf)", group = "<!-- 1 -->Changed" },
  { message = "^(docs|chore|ci|build|test|style|release|revert|deps)", skip = true },
]
